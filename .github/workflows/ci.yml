name: EA2 - Integracion y despliegue continuo

on:
  push:
    branches:
      - main
      - feature/ea2-devops

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    name: Validar y generar resultados
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest tests/ -v

      - name: Generar pagina web
        run: python generar_reporte.py

      - name: Verificar archivo generado
        run: test -f site/index.html

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Preparar sitio para publicacion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  despliegue:
    name: Publicar en GitHub Pages
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar sitio web
        id: deployment
        uses: actions/deploy-pages@v4